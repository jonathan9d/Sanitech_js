<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sanitech — Panneau de contrôle</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="brand">
        <h1>Sanitech</h1>
        <span>Poste d'hygiène</span>
      </div>
      <div class="header-right">
        <div class="status-pill">
          <span class="dot"></span>
          <span class="label">192.168.4.2</span>
        </div>
        <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Bandeau télémétrie -->
    <div class="telemetry">
      <div class="cell">
        <span class="cell-label">PORTE</span>
        <span id="door-text" class="cell-value" style="color: var(--danger)">Fermée</span>
      </div>
      <div class="cell">
        <span class="cell-label">POMPE</span>
        <span id="pump-text" class="cell-value" style="color: var(--text-dim)">
          <span id="pump-dot" class="pulse-dot"></span>Repos
        </span>
      </div>
      <div class="cell">
        <span class="cell-label">DOSES GEL</span>
        <span id="count" class="cell-value" style="color: var(--accent)">0</span>
      </div>
    </div>

    <!-- Contrôle porte -->
    <section class="panel" style="--panel-accent: var(--safe)">
      <div class="panel-head">
        <span class="dot"></span>
        <h3>Contrôle manuel de la porte</h3>
      </div>
      <div class="btn-grid cols-2">
        <button onclick="fetchCall('/door?action=open')" class="btn btn-solid-safe">
          <span class="icon">🔓</span>Ouvrir
        </button>
        <button onclick="fetchCall('/door?action=close')" class="btn btn-solid-danger">
          <span class="icon">🔒</span>Fermer
        </button>
      </div>
    </section>

    <!-- LEDs simples -->
    <section class="panel" style="--panel-accent: var(--warn)">
      <div class="panel-head">
        <span class="dot"></span>
        <h3>LEDs simples</h3>
      </div>
      <div class="btn-grid cols-2" style="margin-bottom: 0.6rem;">
        <button onclick="fetchCall('/led/white?state=on')" class="btn btn-outline">
          <span class="icon">💡</span>Blanche ON
        </button>
        <button onclick="fetchCall('/led/white?state=off')" class="btn btn-outline">
          <span class="icon">🔌</span>Blanche OFF
        </button>
      </div>
      <div class="btn-grid cols-2">
        <button onclick="fetchCall('/led/red?state=toggle')" class="btn btn-outline-danger">
          <span class="icon">🔴</span>Test rouge
        </button>
        <button onclick="fetchCall('/led/green?state=toggle')" class="btn btn-outline-safe">
          <span class="icon">🟢</span>Test verte
        </button>
      </div>
    </section>

    <!-- Distributeur de gel -->
    <section class="panel" style="--panel-accent: var(--accent)">
      <div class="panel-head">
        <span class="dot"></span>
        <h3>Distributeur de gel</h3>
      </div>
      <div class="slider-row">
        <span>Temps d'aspersion</span>
        <span class="value"><span id="val-spray">1.5</span> sec</span>
      </div>
      <input type="range" id="in-spray" min="0.5" max="5.0" step="0.1" value="1.5" oninput="onSlider('spray')">
      <div class="btn-grid cols-2">
        <button onclick="sendSettings()" class="btn btn-solid-accent">Appliquer le réglage</button>
        <button onclick="fetchCall('/test')" class="btn btn-outline">
          <span class="icon">💦</span>Test spray
        </button>
      </div>
    </section>

    <!-- RGB NeoPixel -->
    <section class="panel" style="--panel-accent: var(--violet)">
      <div class="panel-head">
        <span class="dot"></span>
        <h3>Éclairage RGB NeoPixel</h3>
      </div>
      <div class="rgb-picker-row">
        <input type="color" id="rgbPicker" value="#0ea5e9" onchange="sendRGBColor(this.value)">
        <div class="copy">
          <strong>Couleur fixe</strong>
          <span>Choisir une teinte personnalisée</span>
        </div>
      </div>
      <div class="btn-grid cols-4">
        <button onclick="setRGBMode('scan')" id="mode-scan" class="btn btn-mode">Balayage</button>
        <button onclick="setRGBMode('rainbow')" id="mode-rainbow" class="btn btn-mode active">Rampant</button>
        <button onclick="setRGBMode('auto')" id="mode-auto" class="btn btn-mode">Auto</button>
        <button onclick="setRGBMode('off')" id="mode-off" class="btn btn-mode">Éteindre</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast-enter">Commande exécutée</div>

  <script src="index.js"></script>
</body>
</html>
